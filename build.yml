name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
      - name: Download J2ME libs and ProGuard
        run: |
          mkdir libs dist classes stubcls
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fsSL -o libs/cldc.jar $M/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          curl -fsSL -o libs/midp.jar $M/midpapi20/2.0.4/midpapi20-2.0.4.jar
          curl -fsSL -L -o pg.zip https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q pg.zip
      - name: Compile (old Java level, CLDC libs)
        run: |
          JAVAC="$JAVA_HOME/bin/javac"
          LIBS=libs/cldc.jar:libs/midp.jar
          # compile-only stubs for optional phone APIs (sound, file access); never packaged
          $JAVAC -source 1.3 -target 1.3 -bootclasspath $LIBS -d stubcls $(find stubs -name '*.java') \
            || $JAVAC -source 1.4 -target 1.4 -bootclasspath $LIBS -d stubcls $(find stubs -name '*.java')
          (cd stubcls && jar cf ../libs/stubs.jar .)
          $JAVAC -source 1.3 -target 1.3 -bootclasspath $LIBS:libs/stubs.jar -d classes *.java \
            || $JAVAC -source 1.4 -target 1.4 -bootclasspath $LIBS:libs/stubs.jar -d classes *.java
      - name: Package and preverify
        run: |
          printf 'MIDlet-1: Climate WindowOS,,Desk\nMIDlet-Name: Climate WindowOS\nMIDlet-Vendor: Climate\nMIDlet-Version: 0.1.0\nMicroEdition-Configuration: CLDC-1.0\nMicroEdition-Profile: MIDP-2.0\nMIDlet-Permissions-Opt: javax.microedition.io.Connector.file.read, javax.microedition.io.Connector.file.write\n' > manifest.txt
          jar cfm app.jar manifest.txt -C classes . -C res .
          printf -- '-injars app.jar\n-outjars dist/ClimateWindowOS.jar\n-libraryjars libs/cldc.jar\n-libraryjars libs/midp.jar\n-libraryjars libs/stubs.jar\n-microedition\n-dontshrink\n-dontoptimize\n-dontobfuscate\n-dontnote\n-dontwarn\n-keep public class Desk\n' > pg.pro
          java -jar proguard-7.4.2/lib/proguard.jar @pg.pro
          jar ufm dist/ClimateWindowOS.jar manifest.txt
          echo "--- jar contents (kontrol) ---"
          unzip -l dist/ClimateWindowOS.jar | grep -E "wav|Desk|PyApp" || true
          if unzip -l dist/ClimateWindowOS.jar | grep -q "javax/"; then echo "HATA: jar icinde javax var"; exit 1; fi
          SIZE=$(wc -c < dist/ClimateWindowOS.jar | tr -d ' ')
          { cat manifest.txt; echo "MIDlet-Jar-URL: ClimateWindowOS.jar"; echo "MIDlet-Jar-Size: $SIZE"; } > dist/ClimateWindowOS.jad
      - uses: actions/upload-artifact@v4
        with:
          name: ClimateWindowOS
          path: dist/
